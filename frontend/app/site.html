<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain DJ Interface: Remixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Include Styling here
        format:*/

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #000000, #25244d);
            background-size: 100% 100%;
            /* adjusts height to make the gradient stretch and transition smoothly*/
            background-repeat: no-repeat;
            /*makes sure it doesn't repeat*/
            min-height: 100vh;
            /*ensures body is at least viewport height*/
            /*
            margin
            padding
            line-height
            scroll-height
            */
        }

        .title {
            color: white;
            font-weight: bold;
            font-size: 96px;
        }

        .subtitle {
            color: white;
            font-size: 32px;
        }
    </style>
</head>

<body>
    <section id="hero" class="p-8">
        <!--   <div class="container">  -->
        <h1 class="title">Brain DJ Interface: Remixed</h1>
        <h2 class="subtitle">Produced by Decoded Brain at UC San Diego</h2>

        <div class="mt-6 flex flex-row gap-4">
            <!-- Spotify Login Button -->
            <button id="connect-button-control"
                class="hidden relative inline-flex rounded-full items-center justify-center p-0.5 overflow-hidden text-sm font-medium text-heading rounded-base group bg-gradient-to-br from-green-500 to-emerald-600 group-hover:from-green-500 group-hover:to-emerald-600 hover:text-white dark:text-white focus:ring-4 focus:outline-none focus:ring-green-200 dark:focus:ring-green-800">
                <span
                    class="relative px-4 py-2.5 transition-all ease-in duration-75 bg-neutral-primary-soft rounded-base group-hover:bg-transparent group-hover:dark:bg-transparent leading-5 text-white">
                    Connect to Spotify
                </span>
            </button>

            <!-- Stream Control Button -->
            <button id="start-button-control"
                class="hidden relative inline-flex rounded-full items-center justify-center p-0.5 overflow-hidden text-sm font-medium text-heading rounded-base group bg-gradient-to-br from-blue-500 to-purple-500 group-hover:from-blue-500 group-hover:to-purple-500 hover:text-white dark:text-white focus:ring-4 focus:outline-none focus:ring-cyan-200 dark:focus:ring-cyan-800">
                <span
                    class="relative px-4 py-2.5 transition-all ease-in duration-75 bg-neutral-primary-soft rounded-base group-hover:bg-transparent group-hover:dark:bg-transparent leading-5 text-white">
                    Start your Stream
                </span>
            </button>
        </div>

        <!-- Stream Status Title -->
        <div class="mt-6 text-white">
            <h3 id="status-title" class="text-xl font-semibold">Offline</h3>
        </div>

        <!--Recently Played-->
        <div class="mt-8 text-white w-full max-w-lg">
            <h4 class="text-lg font-bold mb-3 border-b border-gray-700 pb-2">Your Stream</h4>
            <div id="song-list" class="grid grid-cols-1 gap-2">
                <div class="text-gray-400">No songs yet.</div>
            </div>
        </div>

        <script>
            const API_BASE = window.location.origin.includes('5005')
                ? window.location.origin
                : 'http://127.0.0.1:5005';

            let pollingInterval = null;
            let config = null;
            let currentSessionId = null;

            // Fetch config dynamic parameters from server
            async function fetchConfig() {
                if (config) return config;
                try {
                    const res = await fetch(`${API_BASE}/api/config`);
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    config = await res.json();
                    return config;
                } catch (err) {
                    console.error("Failed to load backend config:", err);
                    alert("Could not connect to the Brain DJ backend server at " + API_BASE + ". Please make sure your python backend server is running!");
                    throw err;
                }
            }

            // PKCE Helpers
            function dec2hex(dec) {
                return ('0' + dec.toString(16)).substr(-2);
            }

            function generateCodeVerifier() {
                const array = new Uint32Array(56);
                window.crypto.getRandomValues(array);
                return Array.from(array, dec2hex).join('');
            }

            function sha256(plain) {
                const encoder = new TextEncoder();
                const data = encoder.encode(plain);
                return window.crypto.subtle.digest('SHA-256', data);
            }

            function base64urlencode(a) {
                let str = "";
                const bytes = new Uint8Array(a);
                const len = bytes.byteLength;
                for (let i = 0; i < len; i++) {
                    str += String.fromCharCode(bytes[i]);
                }
                return btoa(str)
                    .replace(/\+/g, "-")
                    .replace(/\//g, "_")
                    .replace(/=+$/, "");
            }

            async function generateCodeChallenge(verifier) {
                const hashed = await sha256(verifier);
                return base64urlencode(hashed);
            }

            // Token Management & Dynamic Refresh
            async function getValidToken() {
                const accessToken = localStorage.getItem('spotify_access_token');
                const refreshToken = localStorage.getItem('spotify_refresh_token');
                const expiresAt = localStorage.getItem('spotify_expires_at');

                if (!accessToken || !refreshToken || !expiresAt) {
                    return null;
                }

                // If token expires in less than 5 minutes, refresh it client-side
                if (Date.now() > parseInt(expiresAt) - 5 * 60 * 1000) {
                    try {
                        const cfg = await fetchConfig();
                        const response = await fetch('https://accounts.spotify.com/api/token', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: new URLSearchParams({
                                grant_type: 'refresh_token',
                                refresh_token: refreshToken,
                                client_id: cfg.spotify_client_id
                            })
                        });
                        if (response.ok) {
                            const data = await response.json();
                            localStorage.setItem('spotify_access_token', data.access_token);
                            localStorage.setItem('spotify_expires_at', Date.now() + data.expires_in * 1000);
                            if (data.refresh_token) {
                                localStorage.setItem('spotify_refresh_token', data.refresh_token);
                            }
                            return data.access_token;
                        } else {
                            console.error("Failed to refresh token:", await response.text());
                            localStorage.clear();
                            return null;
                        }
                    } catch (err) {
                        console.error("Error refreshing token:", err);
                        return null;
                    }
                }
                return accessToken;
            }

            // Fetch User profile to establish unique session id
            async function fetchSpotifyUserProfile(token) {
                try {
                    const res = await fetch('https://api.spotify.com/v1/me', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const profile = await res.json();
                        localStorage.setItem('spotify_user_id', profile.id);
                        localStorage.setItem('spotify_display_name', profile.display_name || profile.id);
                        currentSessionId = profile.id;
                    }
                } catch (err) {
                    console.error("Failed to fetch profile:", err);
                }
            }

            // Handle callback from Spotify auth redirect
            async function handleRedirectCallback(code) {
                const codeVerifier = sessionStorage.getItem('spotify_code_verifier');
                if (!codeVerifier) {
                    console.error("No code verifier found in session storage.");
                    return;
                }
                sessionStorage.removeItem('spotify_code_verifier');

                try {
                    const cfg = await fetchConfig();
                    const payload = {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            client_id: cfg.spotify_client_id,
                            grant_type: 'authorization_code',
                            code: code,
                            redirect_uri: cfg.spotify_redirect_uri,
                            code_verifier: codeVerifier,
                        }),
                    };

                    const response = await fetch('https://accounts.spotify.com/api/token', payload);
                    if (response.ok) {
                        const data = await response.json();
                        localStorage.setItem('spotify_access_token', data.access_token);
                        localStorage.setItem('spotify_refresh_token', data.refresh_token);
                        localStorage.setItem('spotify_expires_at', Date.now() + data.expires_in * 1000);

                        await fetchSpotifyUserProfile(data.access_token);
                    } else {
                        console.error("Failed to exchange token:", await response.text());
                    }
                } catch (err) {
                    console.error("Error exchanging token:", err);
                }
            }

            // Check if authenticated on load
            async function checkAuthStatus() {
                const token = await getValidToken();
                const btnConnect = document.getElementById('connect-button-control');
                const btnStart = document.getElementById('start-button-control');
                const statusTitle = document.getElementById('status-title');

                if (token) {
                    currentSessionId = localStorage.getItem('spotify_user_id');
                    const displayName = localStorage.getItem('spotify_display_name') || currentSessionId;

                    if (btnConnect) btnConnect.classList.add('hidden');
                    if (btnStart) btnStart.classList.remove('hidden');

                    if (statusTitle && statusTitle.textContent.startsWith("Please connect")) {
                        statusTitle.textContent = `Connected as ${displayName} (Offline)`;
                    }
                    startPolling();
                } else {
                    if (btnConnect) btnConnect.classList.remove('hidden');
                    if (btnStart) btnStart.classList.add('hidden');
                    if (statusTitle) statusTitle.textContent = "Please connect to Spotify first";
                    stopPolling();
                }
            }

            // Connect button listener
            const btnConnect = document.getElementById('connect-button-control');
            if (btnConnect) {
                btnConnect.addEventListener('click', async () => {
                    try {
                        const cfg = await fetchConfig();
                        if (!cfg.spotify_client_id || !cfg.spotify_redirect_uri) {
                            alert("Backend config is missing Spotify Client ID or Redirect URI.");
                            return;
                        }

                        const verifier = generateCodeVerifier();
                        sessionStorage.setItem('spotify_code_verifier', verifier);
                        const challenge = await generateCodeChallenge(verifier);

                        const scope = 'user-read-currently-playing user-modify-playback-state user-read-playback-state user-read-private playlist-modify-public playlist-modify-private ugc-image-upload';
                        const authUrl = `https://accounts.spotify.com/authorize?` + new URLSearchParams({
                            response_type: 'code',
                            client_id: cfg.spotify_client_id,
                            scope: scope,
                            redirect_uri: cfg.spotify_redirect_uri,
                            code_challenge_method: 'S256',
                            code_challenge: challenge
                        }).toString();

                        window.location.href = authUrl;
                    } catch (err) {
                        console.error("Failed to start login:", err);
                    }
                });
            }

            // Start/Stop button listener
            const btnControl = document.getElementById('start-button-control');
            btnControl.addEventListener('click', async () => {
                const isRunning = btnControl.dataset.running == 'true';

                try {
                    const token = await getValidToken();
                    const refreshToken = localStorage.getItem('spotify_refresh_token');
                    if (!token) {
                        await checkAuthStatus();
                        return;
                    }

                    if (!isRunning) {
                        const res = await fetch(`${API_BASE}/api/start`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                session_id: currentSessionId,
                                access_token: token,
                                refresh_token: refreshToken
                            })
                        });
                        const data = await res.json();
                        updateUI(data);
                    } else {
                        const res = await fetch(`${API_BASE}/api/stop`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                session_id: currentSessionId
                            })
                        });
                        const data = await res.json();
                        updateUI(data);
                    }
                } catch (err) {
                    console.error("Failed to execute control:", err);
                }
            });

            // Update UI list of recently played songs
            function updateHistoryList(songs) {
                const listContainer = document.getElementById('song-list');
                if (!listContainer) return;
                listContainer.innerHTML = '';

                if (songs && songs.length > 0) {
                    songs.forEach((song) => {
                        const card = document.createElement('div');
                        card.className = "bg-gray-100 p-4 rounded shadow-sm text-black";
                        card.textContent = song;
                        listContainer.appendChild(card);
                    });
                } else {
                    listContainer.innerHTML = '<div class="col-span-2 text-gray-400">No songs suggested yet.</div>';
                }
            }

            // Update status text and button text
            function updateUI(state) {
                const statusTitle = document.getElementById('status-title');
                btnControl.dataset.running = (state.status === 'running' || state.status === 'initializing');

                const btnText = btnControl.querySelector('span');
                if (btnText) {
                    btnText.textContent = (state.status === 'stopped') ? "Start your Stream" : "Stop Stream";
                }

                if (statusTitle) {
                    switch (state.status) {
                        case 'stopped':
                            statusTitle.textContent = "Offline";
                            break;
                        case 'initializing':
                            statusTitle.textContent = "Initializing";
                            break;
                        case 'running':
                            statusTitle.textContent = state.current_song ? `Playing: ${state.current_song}` : 'Your Stream has Started';
                            break;
                        case 'completing':
                            statusTitle.textContent = "Generating Title";
                            break;
                        case 'error':
                            statusTitle.textContent = `Error: ${state.message}`;
                            break;
                    }
                }
                updateHistoryList(state.recently_played);
            }

            // Poll status loop
            async function pollStatus() {
                try {
                    if (!currentSessionId) return;
                    const res = await fetch(`${API_BASE}/api/status?session_id=${currentSessionId}`);
                    if (res.ok) {
                        const state = await res.json();
                        updateUI(state);
                    }
                } catch (err) {
                    console.warn("Server is offline:", err);
                }
            }

            function startPolling() {
                if (pollingInterval) return;
                pollStatus();
                pollingInterval = setInterval(pollStatus, 1000);
            }

            function stopPolling() {
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                }
            }

            // DOM load sequence
            window.addEventListener('DOMContentLoaded', async () => {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                if (code) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                    await handleRedirectCallback(code);
                }
                await checkAuthStatus();
            });
        </script>
</body>

</html>
