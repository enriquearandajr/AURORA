<body>
    <section id="hero">
        <!--   <div class="container">  -->
        <h1 class="title">Brain DJ Interface: Remixed</h1>
        <h2 class="subtitle">Produced by Decoded Brain at UC San Diego</h2>

        <button id="start-button-control"
            class="relative inline-flex rounded-full items-center justify-center p-0.5 overflow-hidden text-sm font-medium text-heading rounded-base group bg-gradient-to-br from-blue-500 to-purple-500 group-hover:from-blue-500 group-hover:to-purple-500 hover:text-white dark:text-white focus:ring-4 focus:outline-none focus:ring-cyan-200 dark:focus:ring-cyan-800">
            <span
                class=" relative px-4 py-2.5 transition-all ease-in duration-75 bg-neutral-primary-soft rounded-base group-hover:bg-transparent group-hover:dark:bg-transparent leading-5">
                Start your Stream
            </span>
        </button>

        <!-- Stream Status Title -->
        <div class="mt-6 text-white">
            <h3 id="status-title" class="text-xl font-semibold">Offline</h3>
        </div>

        <!--Recently Played-->
        <div class="mt-8 text-white w-full max-w-lg">
            <h4 class="text-lg font-bold mb-3 border-b border-gray-700 pb-2">Your Stream</h4>
            <div id="song-list" class="grid-grid-cols-1 gap-2">
                <div class="text-gray-400">No songs yet.</div>
            </div>
        </div>




        <script>
            const API_BASE = 'http://localhost:5005';
            let pollingInterval = null;

            // implement start and stop controller using api endpoints
            const btnControl = document.getElementById('start-button-control');
            btnControl.addEventListener('click', async () => {
                // check current state 
                const isRunning = btnControl.dataset.running == 'true';

                try {
                    if (!isRunning) {
                        // if not running, then start
                        const res = await fetch(`${API_BASE}/api/start`, { method: 'POST' });
                        const data = await res.json();
                        updateUI(data);
                    } else {
                        // if running, then stop
                        const res = await fetch(`${API_BASE}/api/stop`, { method: 'POST' });
                        const data = await res.json();
                        updateUI(data);
                    }
                } catch (err) {
                    console.error("Failed to execute control:", err);
                }

            });


            // recently played songs
            function updateHistoryList(songs) {
                const listContainer = document.getElementById('song-list');
                listContainer.innerHTML = ''; // clear old songs


                if (songs && songs.length > 0) {
                    songs.forEach((song) => {
                        const card = document.createElement('div');
                        card.className = "bg-gray-100 p-4 rounded shadow-sm text-black";
                        card.textContent = song;
                        listContainer.appendChild(card);
                    });
                } else {
                    listContainer.innerHTML = '<div class="col-span-2 text-gray-400">No songs suggested yet.</div>';
                }
            }

            //     const statusTitle = document.getElementById('status-title');

            //     // track run status on button dataset

            //     // iterate through different statuses
            //     switch (state.status) {
            //         case 'stopped':
            //             btnControl.textContent = "Start Stream";
            //             statusTitle.textContent = "Your Stream is Offline";
            //             break;
            //         case 'initializing':
            //             btnControl.textContent = "Stop Stream";
            //             statusTitle.textContent = "Initializing Playlist on Spotify...";
            //             break;
            //         case 'running':
            //             btnControl.textContent = "Stop Stream";
            //             // if currently playing song exists, display it
            //             // if not just say stream has started
            //             statusTitle.textContent = state.current_song
            //                 ? `Playing: ${state.current_song}`
            //                 : "Your Stream has Started";
            //             break;
            //     }

            //     // update recently played list
            //     updateHistoryList(state.recently_played);
            // }

            function updateUI(state) {
                const statusTitle = document.getElementById('status-title');

                // track run status on button dataset

                btnControl.dataset.running = (state.status === 'running' || state.status === 'initializing');

                //update button text safely without destroying inner styled span
                const btnText = btnControl.querySelector('span');
                if (btnText) {
                    btnText.textContent = (state.status === 'stopped') ? "Start your Stream" : "Stop Stream";
                }

                //iterate thru different statuses 
                if (statusTitle) {
                    switch (state.status) {
                        case 'stopped':
                            statusTitle.textContent = "Offline";
                            break;
                        case 'initializing':
                            statusTitle.textContent = "Initializing";
                            break;
                        case 'running':
                            statusTitle.textContent = state.current_song ? `Playing: ${state.current_song}` : 'Your Stream has Started';
                            break;
                    }

                }
                // update recently played list
                updateHistoryList(state.recently_played);


            }

            // create polling loop /api/status
            // function that that polls server's state periodically
            async function pollStatus() {
                try {
                    const res = await fetch(`${API_BASE}/api/status`);
                    if (res.ok) {
                        const state = await res.json();
                        updateUI(state);
                    }
                } catch (err) {
                    console.warn("Server is offline:", err);
                    // to implement, a badge that shows "Disconnected "
                }
            }

            pollStatus();
            setInterval(pollStatus, 1000) // every 1000ms or 1 second




        </script>
</body>
